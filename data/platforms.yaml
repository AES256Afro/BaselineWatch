# The fleet: each operating system a team runs, its releases, and the hardware each release runs
# on. Read on every request by src/fleet.ts; the test plan's version and hardware selects, its
# applicability rules and the Platforms page all draw from it. Dates are the vendors', with the
# page each came from; "verify" marks a date inferred from the vendor's practice rather than
# published. Newest release first within a platform: that order is how a template's version rule
# (">=26") is judged. Checked 2026-10-19.

hardware:
  - id: apple-silicon
    label: Apple silicon Mac (M1 and later)
    platforms: [macos]
    secure_element: true
    note: Secure Enclave, sealed system volume, and a boot security policy set in recoveryOS and read with bputil.
  - id: intel-t2
    label: Intel Mac with the Apple T2 Security Chip (2018 to 2020)
    platforms: [macos]
    secure_element: true
    note: iMac Pro 2017; MacBook Air and MacBook Pro 2018 to 2020 (not the M1 models); Mac mini 2018; iMac 27-inch 2020; Mac Pro 2019. System Information shows "Apple T2 chip" under Controller or iBridge. Secure boot is set in Startup Security Utility. macOS 26 Tahoe is the last release, and only for the four models it names.
  - id: intel
    label: Intel Mac without a T2 chip (2017 and earlier)
    platforms: [macos]
    secure_element: false
    note: No Secure Enclave and no secure boot; FileVault and System Integrity Protection still apply. macOS 15 Sequoia at most.
  - id: tpm-2
    label: PC with TPM 2.0 (discrete or firmware)
    platforms: [windows, linux]
    secure_element: true
    note: Every Windows 11 PC. Windows Hello for Business, BitLocker and device health attestation key on it.
  - id: pluton
    label: PC with Microsoft Pluton
    platforms: [windows]
    secure_element: true
    note: Pluton serves as the TPM 2.0 and is updated through Windows Update.
  - id: copilot-plus
    label: Copilot+ PC (40+ TOPS NPU, Pluton)
    platforms: [windows]
    secure_element: true
    note: Recall and the other on-device AI features exist only here and are policy-controlled.
  - id: iphone-a13
    label: iPhone 11 and later (A13 and later), iPhone SE 2nd generation and later
    platforms: [ios]
    secure_element: true
    note: Runs iOS 26 and iOS 27.
  - id: iphone-a12
    label: iPhone XS, XS Max and XR (A12)
    platforms: [ios]
    secure_element: true
    note: iOS 18 is the last release; security updates only.
  - id: ipad
    label: iPad supported by the current iPadOS
    platforms: [ipados]
    secure_element: true
    note: iPad Pro 11-inch 1st generation and 12.9-inch 3rd generation and later, iPad Air 3rd generation and later, iPad 8th generation and later, iPad mini 5th generation and later (verify against Apple's list for the release).
  - id: pixel
    label: Google Pixel (Titan M2)
    platforms: [android]
    secure_element: true
    note: Seven years of OS and security updates from the Pixel 8.
  - id: samsung-knox
    label: Samsung Galaxy with Knox (Knox Vault)
    platforms: [android]
    secure_element: true
    note: Seven years of OS and security updates from the Galaxy S24 series; Knox Platform for Enterprise and Knox attestation.
  - id: android-other
    label: Other Android Enterprise devices
    platforms: [android]
    secure_element: false
    note: A hardware-backed keystore is required of every device; StrongBox or a Knox-class vault is not.
  - id: samsung-interactive
    label: Samsung interactive display (WAD and WAF series, Android)
    platforms: [collaboration]
    secure_element: false
    note: Google EDLA-certified Android (WAD on Android 13, WAF on Android 14) with a Knox Manage licence bundled, so Android Enterprise and Knox controls apply.
  - id: samsung-signage
    label: Samsung smart signage (Tizen)
    platforms: [collaboration]
    secure_element: false
    note: QM, QB, QH and the large-format QHFX on Tizen 8; managed through MagicINFO Server or signageOS. Knox Configure does not manage Tizen signage.
  - id: teams-rooms-windows
    label: Microsoft Teams Rooms on Windows
    platforms: [collaboration]
    secure_element: true
    note: A Windows 11 IoT Enterprise PC with TPM 2.0 running the Teams Rooms app, enrolled in Intune.
  - id: teams-rooms-android
    label: Microsoft Teams Rooms on Android
    platforms: [collaboration]
    secure_element: false
    note: Certified Android devices managed through the Teams admin center and Intune (AOSP device management).
  - id: zoom-rooms
    label: Zoom Rooms appliance or controller
    platforms: [collaboration]
    secure_element: false
  - id: webex-device
    label: Cisco Webex room device (RoomOS)
    platforms: [collaboration]
    secure_element: true

platforms:
  windows:
    releases:
      - id: 26H2
        label: Windows 11, version 26H2
        status: current
        released: "2026-09-29"
        support_ends: "Home and Pro 2028-10-10; Enterprise, Education and IoT Enterprise 2029-10-09 (Microsoft's lifecycle pages, in Pacific time, show the day before)"
        hardware: [tpm-2, pluton, copilot-plus]
        baselines:
          - DISA Microsoft Windows 11 STIG (one STIG covers every Windows 11 version)
          - Microsoft Security Baseline for Windows 11, version 26H2 (Security Compliance Toolkit, 2026-10-08)
          - CIS Microsoft Windows 11 Enterprise Benchmark
        documents: { stig: "stig:microsoft-windows-11" }
        notes:
          - The 2026 feature update; no 26H2 LTSC release. The toolkit's "Windows 11 v26H2 Security Baseline" shipped 2026-10-08.
          - Administrator protection becomes on by default with the October 2026 security update where the security baseline is applied.
        sources:
          - { title: "Microsoft, Windows 11 release information", url: "https://learn.microsoft.com/windows/release-health/windows11-release-information" }
          - { title: "Microsoft Security Baselines blog, Windows 11 version 26H2 security baseline", url: "https://techcommunity.microsoft.com/blog/microsoft-security-baselines/windows-11-version-26h2-security-baseline/4560382" }
      - id: 26H1
        label: Windows 11, version 26H1 (new devices only)
        status: supported
        released: "2026-02-10"
        support_ends: "Home and Pro 2028-03-14; Enterprise and Education 2029-03-13"
        hardware: [tpm-2, pluton, copilot-plus]
        baselines:
          - DISA Microsoft Windows 11 STIG
          - Microsoft Security Baseline for Windows 11, version 26H2 (the toolkit publishes none for 26H1; verify with the blog)
        documents: { stig: "stig:microsoft-windows-11" }
        notes:
          - Ships only on new devices and is not offered as an in-place update; a 26H1 device moves to 26H2.
        sources:
          - { title: "Microsoft, Windows 11 release information", url: "https://learn.microsoft.com/windows/release-health/windows11-release-information" }
          - { title: "Microsoft Lifecycle, Windows 11 Enterprise and Education", url: "https://learn.microsoft.com/lifecycle/products/windows-11-enterprise-and-education" }
      - id: 25H2
        label: Windows 11, version 25H2
        status: supported
        released: "2025-09-30"
        support_ends: "Home and Pro 2027-10-12; Enterprise and Education 2028-10-10"
        hardware: [tpm-2, pluton, copilot-plus]
        baselines:
          - DISA Microsoft Windows 11 STIG
          - Microsoft Security Baseline for Windows 11, version 25H2 (Security Compliance Toolkit)
          - CIS Microsoft Windows 11 Enterprise Benchmark
        documents: { stig: "stig:microsoft-windows-11", sct: "baseline:windows-11-v25h2" }
        notes:
          - An enablement package on the 24H2 servicing branch; the same monthly update serves both.
          - Removes Windows PowerShell 2.0 and the WMIC tool; adds a policy to remove preinstalled Microsoft Store apps on Enterprise and Education.
          - Administrator protection (just-in-time elevation with a Windows Hello prompt) arrived for 24H2 and 25H2 with the August 2026 update (KB5120998), off by default; the October 2026 security update turns it on where the baseline is applied.
        sources:
          - { title: "Microsoft, What's new in Windows 11, version 25H2", url: "https://learn.microsoft.com/windows/whats-new/whats-new-windows-11-version-25h2" }
          - { title: "Microsoft Lifecycle, Windows 11 Home and Pro", url: "https://learn.microsoft.com/lifecycle/products/windows-11-home-and-pro" }
      - id: 24H2
        label: Windows 11, version 24H2
        status: supported
        released: "2024-10-01"
        support_ends: "Home and Pro ended 2026-10-13; Enterprise and Education 2027-10-12"
        hardware: [tpm-2, pluton, copilot-plus]
        baselines:
          - DISA Microsoft Windows 11 STIG
          - Microsoft Security Baseline for Windows 11, version 24H2 (Security Compliance Toolkit)
          - CIS Microsoft Windows 11 Enterprise Benchmark
        documents: { stig: "stig:microsoft-windows-11", sct: "baseline:windows-11-v24h2" }
        notes:
          - SMB signing is required by default for outbound and inbound connections.
          - Sudo for Windows, Personal Data Encryption for folders, Windows Protected Print mode, App Control for Business, SMB client encryption and NTLM blocking, a restrictive File and Printer Sharing firewall group, Rust in the kernel (win32kbase_rs.sys), and Local Security Authority protection turned on after an upgrade audit all arrive here. NTLMv1 is removed.
          - Config Refresh is older than 24H2 (22H2 and 21H2 with their 2024 updates); hotpatching is licensed separately.
          - Device encryption (BitLocker) turns on by default on clean installs that meet the requirements.
        sources:
          - { title: "Microsoft, What's new in Windows 11, version 24H2", url: "https://learn.microsoft.com/windows/whats-new/whats-new-windows-11-version-24h2" }
      - id: 23H2
        label: Windows 11, version 23H2
        status: supported
        released: "2023-10-31"
        support_ends: "Home and Pro ended 2025-11-11; Enterprise and Education 2026-11-10"
        hardware: [tpm-2, pluton]
        baselines:
          - DISA Microsoft Windows 11 STIG
          - Microsoft Security Baseline for Windows 11, version 23H2 (Security Compliance Toolkit)
          - CIS Microsoft Windows 11 Enterprise Benchmark
        documents: { stig: "stig:microsoft-windows-11", sct: "baseline:windows-11-v23h2" }
        notes:
          - Enterprise and Education have weeks left; plan the move to 25H2 or 26H2.
        sources:
          - { title: "Microsoft Lifecycle, Windows 11 Enterprise and Education", url: "https://learn.microsoft.com/lifecycle/products/windows-11-enterprise-and-education" }
      - id: 22H2
        label: Windows 11, version 22H2
        status: ended
        released: "2022-09-20"
        support_ends: "Home and Pro ended 2024-10-08; Enterprise and Education ended 2025-10-14"
        hardware: [tpm-2]
        baselines:
          - DISA Microsoft Windows 11 STIG
          - Microsoft Security Baseline for Windows 11, version 22H2 (Security Compliance Toolkit)
        documents: { stig: "stig:microsoft-windows-11", sct: "baseline:windows-11-v22h2" }
        notes:
          - Out of servicing on every edition; a device still here is a finding, not a test subject.
        sources:
          - { title: "Microsoft Lifecycle, Windows 11 Enterprise and Education", url: "https://learn.microsoft.com/lifecycle/products/windows-11-enterprise-and-education" }
      - id: 10-22H2
        label: Windows 10, version 22H2
        status: ended
        released: "2022-10-18"
        support_ends: "Ended 2025-10-14; Extended Security Updates for organisations run up to three years from November 2025 (price doubling each year); the consumer programme ends 2027-10-12"
        hardware: []
        baselines:
          - DISA Microsoft Windows 10 STIG
          - Microsoft Security Baseline for Windows 10, version 22H2 (Security Compliance Toolkit)
        documents: { stig: "stig:microsoft-windows-10" }
        notes:
          - Only with Extended Security Updates; test that the ESU licence is active and updates still arrive.
        sources:
          - { title: "Microsoft, Windows 10 Extended Security Updates", url: "https://learn.microsoft.com/windows/whats-new/extended-security-updates" }

