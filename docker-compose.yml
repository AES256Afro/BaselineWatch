services:
  baselinewatch:
    build: .
    # A local build, named as one: the published images are ghcr.io/aes256afro/baselinewatch:<version>.
    image: baselinewatch:local
    container_name: baselinewatch
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      BW_BASE_URL: ${BW_BASE_URL:-http://localhost:8790}
      BW_PUBLIC_READ: ${BW_PUBLIC_READ:-true}
      # Without a password every write is open (single-user mode); set one before publishing beyond loopback.
      BW_ADMIN_PASSWORD: ${BW_ADMIN_PASSWORD:-}
      BW_SESSION_SECRET: ${BW_SESSION_SECRET:-}
      BW_NVD_API_KEY: ${BW_NVD_API_KEY:-}
      BW_NOTIFY_URL: ${BW_NOTIFY_URL:-}
      BW_LLM_URL: ${BW_LLM_URL:-}
    ports:
      # Loopback unless BW_BIND says otherwise (BW_BIND=0.0.0.0 for the LAN, with a password set).
      - "${BW_BIND:-127.0.0.1}:${BW_PORT:-8790}:8790"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
